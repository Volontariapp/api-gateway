name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check-arch:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node & Yarn
        uses: Volontariapp/ci-tools/.github/actions/setup-node-yarn@main
        with:
          node-version: '24.14.0'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Check DTO Architecture
        run: yarn check-arch

  ci:
    needs: check-arch
    uses: Volontariapp/ci-tools/.github/workflows/service-ci.yml@main
    with:
      service-name: api-gateway
    secrets: inherit

  ci-docker:
    needs: check-arch
    permissions:
      contents: read
      packages: write
    uses: Volontariapp/ci-tools/.github/workflows/service-docker-build-push.yml@main
    with:
      service-name: api-gateway
    secrets: inherit

  e2e:
    needs: [ci-docker]
    uses: Volontariapp/ci-tools/.github/workflows/e2e-orchestrator.yml@main
    secrets: inherit

  validate-e2e-matrix:
    uses: Volontariapp/ci-tools/.github/workflows/e2e-matrix-checker.yml@main
    with:
      service-name: api-gateway

  deploy-push:
    name: Deploy Repo Submodule Push (api-gateway)
    needs: [ci, ci-docker, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Update Deploy Submodule and Images
        uses: Volontariapp/ci-tools/.github/actions/update-deploy@main
        with:
          service: api-gateway
          sha: ${{ github.sha }}
          org-repo-token: ${{ secrets.ORG_REPO_TOKEN }}
          image-match: 'ghcr.io/volontariapp/api-gateway'

  notify-ready:
    needs: [check-arch, ci, ci-docker, e2e, validate-e2e-matrix]
    # `needs:` implies success(): without !failure() a skipped job would skip the notification.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    # A reusable workflow cannot raise the permissions of its caller.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Volontariapp/ci-tools/.github/workflows/pr-ready-notify.yml@main
    with:
      channel: backend
    secrets: inherit
